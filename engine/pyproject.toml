[project]
name = "bom-scene-engine"
version = "0.1.0"
description = "BOM → 场景智能匹配引擎：输入产品BOM，输出适配场景 + Gap分析 + 方案文档"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "click>=8.0",
]

[project.scripts]
bom-scene = "src.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
